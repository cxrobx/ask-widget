[project]
name = "ask-widget"
version = "0.1.0"
description = "Highlight-to-ask reading companion: a drop-in HTML widget + local Claude CLI server."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

# `uvicorn[standard]` pulls httptools/uvloop. On Python 3.14 these may need a
# source build; install this extra only if the wheels are available for your
# interpreter, otherwise the bare `uvicorn` dependency above is enough.
[project.optional-dependencies]
fast = ["uvicorn[standard]>=0.27"]

[project.scripts]
ask-widget = "ask_widget.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_widget"]
