name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --requirement requirements-test.lock
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: swiftc -typecheck -framework Cocoa -framework WebKit -framework UniformTypeIdentifiers launcher/AskWidget.swift
      - run: plutil -lint launcher/Info.plist

  browser:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --requirement requirements-browser.lock
      - run: python -m playwright install chromium
      - run: PYTHONPATH=src python -m unittest tests.browser_smoke -v

  bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: ./launcher/build-app.sh --no-install
      - run: ./scripts/smoke-bundle.sh
