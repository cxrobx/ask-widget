name: icon

# Compiles the app icon's Assets.car on macOS 26, whose Xcode is the first that reads
# Icon Composer (.icon) files. Run by hand; the chosen Assets.car is committed as
# launcher/icon/Assets.car. See launcher/icon/compile.sh.
on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        fill: [none, system-dark]
        min: ["13.0", "26.0"]
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: MIN_TARGET=${{ matrix.min }} ./launcher/icon/compile.sh ${{ matrix.fill }} out
      - uses: actions/upload-artifact@v4
        with:
          name: icon-${{ matrix.fill }}-min${{ matrix.min }}
          path: out
